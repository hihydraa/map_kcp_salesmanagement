<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KCP Map For Sales Management (Active Customer & Leads)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS for Excel export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100vw; }
   /* Tooltip (มีแล้ว แต่คงไว้ได้) */
    .leaflet-tooltip.my { background:#111827; color:#fff; border:none; }
    
    /* ✅ Popup ให้เป็นโทนเข้ม + ตัวอักษรขาว */
    .leaflet-popup.my .leaflet-popup-content-wrapper {
      background: #111827;
      color: #fff;
      border-radius: 12px;
    }
    .leaflet-popup.my .leaflet-popup-tip {
      background: #111827;
    }
    .leaflet-popup.my .leaflet-popup-content table,
    .leaflet-popup.my .leaflet-popup-content td {
      color: #fff;
    }

    .badge { padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="panel" class="fixed z-[999] top-3 left-3 w-[360px] max-w-[92vw] bg-white/95 backdrop-blur border border-gray-200 rounded-2xl shadow-xl">
    <div class="p-4 border-b">
      <h1 class="text-xl font-bold text-gray-900">KCP Map For Sales Management (Real-Time)</h1>
      <p class="text-xs text-gray-500">แผนที่บริหารลูกค้าปัจจุบัน & ลูกค้ามุ่งหวัง</p>
    </div>

    <div class="p-4 flex flex-col gap-3">
      <div class="grid grid-cols-2 gap-2">
        <label class="text-xs text-gray-600">สาขา (Branch)
          <select id="branchFilter" class="w-full mt-1 rounded-lg border-gray-300 text-sm"></select>
        </label>

        <!-- ✅ เปลี่ยน Manager -> ผู้รับผิดชอบ (ดึงจาก Customers.person_incharge) -->
        <label class="text-xs text-gray-600">ผู้รับผิดชอบ
          <select id="managerFilter" class="w-full mt-1 rounded-lg border-gray-300 text-sm"></select>
        </label>

        <label class="text-xs text-gray-600">รถมิเตอร์ (Truck)
          <select id="truckFilter" class="w-full mt-1 rounded-lg border-gray-300 text-sm"></select>
        </label>

        <label class="text-xs text-gray-600">สถานะลูกค้า
          <select id="statusFilter" class="w-full mt-1 rounded-lg border-gray-300 text-sm">
            <option value="">ทั้งหมด</option>
            <option value="ลูกค้า Active">ลูกค้า Active</option>
            <option value="เสี่ยงที่จะเป็นลูกค้าหาย">เสี่ยงที่จะเป็นลูกค้าหาย</option>
            <option value="ลูกค้าหาย">ลูกค้าหาย</option>
            <option value="ลูกค้ากลับมา/ลูกค้าใหม่">ลูกค้ากลับมา/ลูกค้าใหม่</option>
            <option value="หายเกิน 60 วัน">หายเกิน 60 วัน</option>
          </select>
        </label>

        <!-- ตัวกรองรัศมี 100 กม. หลายสาขา (Multiple choice) -->
        <div class="col-span-2 text-xs text-gray-600">
          รัศมี 100 กม. รอบสาขา (เลือกได้หลายสาขา)
          <div class="mt-1 flex flex-wrap gap-2">
            <label class="inline-flex items-center gap-1">
              <input type="checkbox" class="radiusChoice rounded" value="ST" />
              <span class="text-xs">ST</span>
            </label>
            <label class="inline-flex items-center gap-1">
              <input type="checkbox" class="radiusChoice rounded" value="KN" />
              <span class="text-xs">KN</span>
            </label>
            <label class="inline-flex items-center gap-1">
              <input type="checkbox" class="radiusChoice rounded" value="MUK" />
              <span class="text-xs">MUK</span>
            </label>
            <label class="inline-flex items-center gap-1">
              <input type="checkbox" class="radiusChoice rounded" value="WNN" />
              <span class="text-xs">WNN</span>
            </label>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <label class="inline-flex items-center gap-2 text-sm">
          <input id="toggleLeads" type="checkbox" class="rounded" checked /> แสดง Leads
        </label>
        <label class="inline-flex items-center gap-2 text-sm">
          <input id="toggleNearest" type="checkbox" class="rounded" checked /> คำนวณรถที่ใกล้สุดให้ Leads
        </label>
      </div>

      <div class="flex gap-2 flex-wrap">
        <button id="btnRefresh" class="px-3 py-2 text-sm rounded-lg bg-gray-900 text-white">รีเฟรชข้อมูล</button>
        <button id="btnReset" class="px-3 py-2 text-sm rounded-lg border">ล้างตัวกรอง</button>
        <button id="btnExport" class="px-3 py-2 text-sm rounded-lg bg-emerald-600 text-white">ส่งออก (Excel)</button>
      </div>

      <div class="rounded-xl border bg-white p-3">
        <div class="text-xs text-gray-500 mb-1">สรุป</div>
       <div id="summary" class="text-sm grid grid-cols-2 gap-x-3 gap-y-1">
        <div>Customers:</div><div id="sumCustomers" class="font-semibold">-</div>
        <div>Leads:</div><div id="sumLeads" class="font-semibold">-</div>
        <div>ลูกค้า Active:</div><div id="sumActive" class="font-semibold">-</div>
        <div>เสี่ยงที่จะเป็นลูกค้าหาย:</div><div id="sumRisky" class="font-semibold">-</div>
        <div>ลูกค้าหาย:</div><div id="sumLost" class="font-semibold">-</div>
        <div>ลูกค้ากลับมา/ลูกค้าใหม่:</div><div id="sumWinback" class="font-semibold">-</div>
        <div>หายเกิน 60 วัน:</div><div id="sumDormant" class="font-semibold">-</div>

      </div>

        <div id="errorBox" class="text-xs text-red-600 mt-2 hidden"></div>
      </div>

      <div class="text-xs text-gray-500">ตั้งค่าในชีท: <span class="font-mono">Settings</span></div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // -------- CONFIG --------
    const SHEET_ID = "1KicClhZHtMr9bBmwLv31zvb0021SRUcGr2eRRagsO6c";
    const SHEETS = { customers: "Customers", leads: "leads", trucks: "Trucks", settings: "Settings" };

    // center แต่ละสาขา + รัศมี 100 กม.
    const BRANCH_RADIUS_CENTERS = {
      ST:  { lat: 16.381029272179042, lng: 103.34881852164082 },
      KN:  { lat: 16.71600409911031,  lng: 103.08205194412724 },
      MUK: { lat: 16.43599207530131,  lng: 104.61612804232725 },
      WNN: { lat: 17.6293190999291,   lng: 103.7676571040772 }
    };
    const RADIUS_FILTER_KM = 100;

    // สีรัศมีแต่ละสาขา
    const RADIUS_COLORS = {
      ST:  { stroke: "#3b82f6", fill: "#3b82f6" },
      KN:  { stroke: "#22c55e", fill: "#22c55e" },
      MUK: { stroke: "#a855f7", fill: "#a855f7" },
      WNN: { stroke: "#ef4444", fill: "#ef4444" }
    };

    // -------- UTIL --------
    function showError(msg){
      console.error(msg);
      const box=document.getElementById('errorBox');
      box.textContent=msg;
      box.classList.remove('hidden');
    }

    async function fetchSheet(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&tq=`;
      const res = await fetch(url, { cache: "no-store" });
      const text = await res.text();
      if(!text.includes('google.visualization')) throw new Error(`โหลดชีท "${sheetName}" ไม่สำเร็จ\n${text.slice(0,160)}`);
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
      const cols = json.table.cols.map(c => c.label || c.id);
      const rows = json.table.rows.map(r => (r.c||[]).map(c => c ? (c.f ?? c.v ?? "") : ""));
      return rows.map(r => Object.fromEntries(r.map((v,i) => [cols[i] || `col${i+1}`, v])));
    }

    const normHex = (c) => {
      if (!c) return "";
      const raw = String(c).trim().replace(/^#/, "");
      if (/^[0-9A-Fa-f]{6}$/.test(raw)) return "#" + raw.toUpperCase();
      return "";
    };
    const normId = (id) => (id || "").toString().trim().toLowerCase();
    const uniqueSorted = (arr) => [...new Set(arr.filter(v => v!==undefined && v!==null && String(v).trim()!==''))].sort((a,b)=>String(a).localeCompare(String(b),'th'));
    const gmapsUrl = (lat,lng) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(lat+","+lng)}`;

    const haversineKm=(a,b,c,d)=>{
      const R=6371,toRad=x=>x*Math.PI/180;
      const dLat=toRad(c-a),dLon=toRad(d-b);
      const h=Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
      return 2*R*Math.asin(Math.sqrt(h));
    };

    // Google-style Pin (SVG)
    function makePinIcon(colorHex){
      const c = (colorHex||'#EF4444').replace('#','');
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="40" viewBox="0 0 26 40">
          <defs>
            <filter id="shadow" x="-20%" y="-10%" width="140%" height="140%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" />
              <feOffset dx="0" dy="1" result="o"/>
              <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path filter="url(#shadow)" d="M13 0C6.373 0 1 5.373 1 12c0 8.25 12 27 12 27s12-18.75 12-27C25 5.373 19.627 0 13 0z" fill="#${c}" stroke="#7a7a7a" stroke-width="0.6"/>
          <circle cx="13" cy="12" r="5" fill="#fff"/>
        </svg>`;
      return L.icon({
        iconUrl: 'data:image/svg+xml;utf8,' + encodeURIComponent(svg),
        iconSize: [18,28],
        iconAnchor: [9,28],
        popupAnchor: [0,-24],
        tooltipAnchor: [0,-24]
      });
    }

    function leadPinColor(statusText){
      const s = String(statusText || '').trim();
      if (s === 'ปิดการขาย') return '#308320';
      return '#EF4444';
    }

    // ✅ Map customer status (จากชีท Customers.status) -> TH
    function mapStatusTH(raw){
      if(raw==null) return "";
      const s = String(raw).trim();
      const sl = s.toLowerCase();

      if (sl === 'active') return 'ลูกค้า Active';
      if (sl === 'risky to lost') return 'เสี่ยงที่จะเป็นลูกค้าหาย';
      if (sl === 'lost customer') return 'ลูกค้าหาย';

      if (sl === 'winback/new customer' || sl === 'winback' || sl === 'new customer' || sl === 'new')
        return 'ลูกค้ากลับมา/ลูกค้าใหม่';

      if (sl === 'dormant >60' || sl === 'dormant' || sl === 'deep lost' || sl === 'lost >60')
        return 'หายเกิน 60 วัน';

      if (s === 'ลูกค้า active') return 'ลูกค้า Active';
      return s;
    }

   
    const FIELD_LABELS = {
  customer_id: "รหัสลูกค้า",
  customer_name: "ชื่อลูกค้า",
  _statusTH: "สถานะลูกค้า",
  branch: "สาขา",
  truck_id: "รถ",
  person_incharge: "ผู้รับผิดชอบ",
  lastest_sales: "บิลขายล่าสุด",
  notes: "หมายเหตุ",
  latitude: "Latitude",
  longitude: "Longtitude",

  // Leads (เผื่อใช้)
  lead_id: "รหัส Lead",
  leads_name: "ชื่อลีด",
  status: "สถานะ Lead",
  saler: "พนักงานขาย",
  province: "จังหวัด",
  district: "อำเภอ",
  nearest_truck_id: "รถที่ใกล้ที่สุด"
};

    
    
    
    
    function buildRowsHtml(obj, fields){
  return fields
    .filter(k => obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== "")
    .map(k => `<tr>
      <td class="pr-2 text-slate-300 whitespace-nowrap">
        ${FIELD_LABELS[k] || k}
      </td>
      <td class="font-semibold text-white">
        ${obj[k]}
      </td>
    </tr>`)
    .join('');
}


    // ✅ Truck colors map
    let truckColorMap = {};
    const getTruckColor = (id) => truckColorMap[normId(id)] || "";

    function tooltipHtml(obj,type){
      const fields = (type==='customer')
        ? ['customer_id','customer_name','lastest_sales','_statusTH','branch','truck_id','person_incharge','notes']
        : ['lead_id','leads_name','status','province','district','nearest_truck_id','saler','customer_id','notes','_branch'];
      const rows = buildRowsHtml(obj, fields);
      const badge= type==='customer'
        ? `<span class="badge" style="background:${getTruckColor(obj.truck_id)||'#16a34a'};color:white">${obj._statusTH||''}</span>`
        : `<span class="badge" style="background:#2563eb;color:white">LEAD</span>`;
      return `<div class="text-sm">
        <div class="mb-1 font-bold">${obj.customer_name||obj.leads_name||obj.truck_id} ${badge}</div>
        <table class="text-xs">${rows}</table>
      </div>`;
    }

    function popupHtml(obj,type){
      const lat = parseFloat(obj.latitude||obj.lat||obj.lattitude);
      const lng = parseFloat(obj.longitude||obj.lng||obj.longtitude||obj.lon);
      const fields = (type==='customer')
        ? ['customer_id','customer_name','lastest_sales','_statusTH','branch','truck_id','person_incharge','notes']
        : ['lead_id','leads_name','status','province','district','nearest_truck_id','saler','customer_id','notes','_branch'];
      const rows = buildRowsHtml(obj, fields);
      const gmBtn = (isFinite(lat)&&isFinite(lng))
        ? `<a href="${gmapsUrl(lat,lng)}" target="_blank" rel="noopener" class="mt-2 inline-block text-xs font-semibold text-blue-300 underline">เปิดใน Google Maps</a>`:'';
      return `<div class="text-sm">
        <div class="mb-1 font-bold">${obj.customer_name||obj.leads_name||obj.truck_id}</div>
        <table class="text-xs">${rows}</table>
        ${gmBtn}
      </div>`;
    }

    // radius multiple choice selection
    function getSelectedRadiusBranches(){
      const nodes = document.querySelectorAll('.radiusChoice');
      return Array.from(nodes)
        .filter(ch => ch.checked)
        .map(ch => ch.value)
        .filter(v => !!BRANCH_RADIUS_CENTERS[v]);
    }

    // ✅ Filter ใช้ person_incharge (Customers) และ Leads ใช้ saler (ถ้าต้องการกรองตามผู้รับผิดชอบร่วมกัน)
    //    ตอนนี้ requirement คือ "ผู้รับผิดชอบ" จาก Customers.person_incharge
    function passFilters(item){
      const b = branchFilter.value;
      const m = managerFilter.value;
      const t = truckFilter.value;
      const s = statusFilter.value;
      const selectedBranches = getSelectedRadiusBranches();

      // Branch: Customers.branch | Leads._branch (derive from customer_id)
      if(b){
        const itemBranch = (item._branch || item.branch || "");
        if(itemBranch !== b) return false;
      }

      // ผู้รับผิดชอบ: ใช้ person_incharge (Customers เท่านั้น)
      if(m && (item.person_incharge||'')!==m) return false;

      // Truck filter: customer.truck_id OR lead.nearest_truck_id
      if(t){
        const v = (item.truck_id || item.nearest_truck_id || "");
        if(v !== t) return false;
      }

      // Status filter: ใช้ _statusTH (Customers เท่านั้น)
      if(s && (item._statusTH||'')!==s) return false;

      // Radius filter
      if(selectedBranches.length){
        const lat = parseFloat(item.latitude||item.lat||item.lattitude);
        const lng = parseFloat(item.longitude||item.lng||item.longtitude||item.lon);
        if(!isFinite(lat) || !isFinite(lng)) return false;

        let insideAny = false;
        for(const code of selectedBranches){
          const center = BRANCH_RADIUS_CENTERS[code];
          const d = haversineKm(center.lat, center.lng, lat, lng);
          if(d <= RADIUS_FILTER_KM){
            insideAny = true;
            break;
          }
        }
        if(!insideAny) return false;
      }

      return true;
    }


    function setSummary({customers, leads}){
      sumCustomers.textContent = customers.length;
      sumLeads.textContent = leads.length;
    
      sumActive.textContent  = customers.filter(c => (c._statusTH||'')==='ลูกค้า Active').length;
      sumRisky.textContent   = customers.filter(c => (c._statusTH||'')==='เสี่ยงที่จะเป็นลูกค้าหาย').length;
      sumLost.textContent    = customers.filter(c => (c._statusTH||'')==='ลูกค้าหาย').length;
    
      // ✅ เพิ่ม 2 สถานะใหม่
      sumWinback.textContent = customers.filter(c => (c._statusTH||'')==='ลูกค้ากลับมา/ลูกค้าใหม่').length;
      sumDormant.textContent = customers.filter(c => (c._statusTH||'')==='หายเกิน 60 วัน').length;
    }


    // Map + Layers
    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

    const layerCustomers=L.layerGroup().addTo(map),
          layerLeads=L.layerGroup().addTo(map),
          layerTrucks=L.layerGroup().addTo(map),
          layerLines=L.layerGroup().addTo(map),
          layerRadius=L.layerGroup().addTo(map);

    let data={customers:[],leads:[],trucks:[],settings:[]};

    function render(){
      layerCustomers.clearLayers();
      layerLeads.clearLayers();
      layerTrucks.clearLayers();
      layerLines.clearLayers();
      layerRadius.clearLayers();

      // Draw selected radius circles
      const selectedBranches = getSelectedRadiusBranches();
      selectedBranches.forEach(code=>{
        const c = BRANCH_RADIUS_CENTERS[code];
        if(!c) return;
        const col = RADIUS_COLORS[code] || { stroke: "#0ea5e9", fill: "#0ea5e9" };
        L.circle([c.lat, c.lng], {
          radius: RADIUS_FILTER_KM * 1000,
          color: col.stroke,
          weight: 2,
          fillColor: col.fill,
          fillOpacity: 0.10
        }).addTo(layerRadius);
      });

      // Trucks
      data.trucks.forEach(t=>{
        const lat=+ (t.latitude||t.lat||t.lattitude), lng=+ (t.longitude||t.lng||t.longtitude||t.lon);
        if(!isFinite(lat)||!isFinite(lng)) return;
        const col=normHex(t.color)||'#111827';
        L.circleMarker([lat,lng],{radius:7,color:col,weight:2,fillColor:'#fff',fillOpacity:1})
          .bindTooltip(`<div class="text-sm font-bold">${t.truck_id}</div>`,{className:'my',sticky:true})
          .addTo(layerTrucks);
      });

      const cust = data.customers.filter(passFilters);
      const leads = (toggleLeads.checked ? data.leads : []).filter(passFilters);

      // Customers
      cust.forEach(c=>{
        const lat=+ (c.latitude||c.lat||c.lattitude), lng=+ (c.longitude||c.lng||c.longtitude||c.lon);
        if(!isFinite(lat)||!isFinite(lng)) return;
        const col=getTruckColor(c.truck_id) || '#16a34a';
        const m = L.circleMarker([lat,lng],{
            radius:6,
            color:'#111827',
            weight:1,
            fillColor:col,
            fillOpacity:0.6
          })
          .bindTooltip(tooltipHtml(c,'customer'),{className:'my',sticky:true})
          .addTo(layerCustomers);
        m.on('click',()=>{ m.bindPopup(popupHtml(c,'customer'), {autoClose:true, closeOnClick:true, className:'my'}).openPopup(); });
      });

      // Leads + nearest truck
      const wantNearest = toggleNearest.checked;
      leads.forEach(l=>{
        const lat=+ (l.latitude||l.lat||l.lattitude), lng=+ (l.longitude||l.lng||l.longtitude||l.lon);
        if(!isFinite(lat)||!isFinite(lng)) return;

        const pinCol = leadPinColor(l.status);
        const marker = L.marker([lat,lng], { icon: makePinIcon(pinCol) })
          .bindTooltip(tooltipHtml(l,'lead'), { className:'my', sticky:true })
          .addTo(layerLeads);

        marker.on('click', ()=>{ marker.bindPopup(popupHtml(l,'lead'), {autoClose:true, closeOnClick:true, className:'my'}).openPopup(); });

        // draw line to nearest truck (computed)
        if(wantNearest){
          let best={d:Infinity,t:null};
          data.trucks.forEach(t=>{
            const tlat=+(t.latitude||t.lat||t.lattitude), tlng=+(t.longitude||t.lng||t.longtitude||t.lon);
            if(!isFinite(tlat)||!isFinite(tlng)) return;
            const d=haversineKm(lat,lng,tlat,tlng);
            if(d<best.d) best={d,t};
          });
          if(best.t){
            const tlat=+(best.t.latitude||best.t.lat||best.t.lattitude), tlng=+(best.t.longitude||best.t.lng||best.t.longtitude||best.t.lon);
            L.polyline([[lat,lng],[tlat,tlng]],{color:'#64748b',weight:1.5,dashArray:'4 4'}).addTo(layerLines);
          }
        }
      });

      // Fit bounds
      const all=[];
      layerCustomers.eachLayer(l=>all.push(l.getLatLng()));
      layerLeads.eachLayer(l=>all.push(l.getLatLng()));
      layerTrucks.eachLayer(l=>all.push(l.getLatLng()));
      selectedBranches.forEach(code=>{
        const c = BRANCH_RADIUS_CENTERS[code];
        if(c) all.push(L.latLng(c.lat, c.lng));
      });

      if(all.length) map.fitBounds(L.latLngBounds(all),{padding:[60,60]});

      setSummary({customers:cust,leads});
    }

    async function loadAndRender(){
      try{
        errorBox.classList.add('hidden');

        const [settings, customersRaw, leadsRaw, trucks] = await Promise.all([
          fetchSheet(SHEETS.settings),
          fetchSheet(SHEETS.customers),
          fetchSheet(SHEETS.leads),
          fetchSheet(SHEETS.trucks)
        ]);

        // Customers: add TH status
        const customersData = customersRaw.map(c => ({ ...c, _statusTH: mapStatusTH(c.status) }));

        // Trucks: color map
        truckColorMap = {};
        trucks.forEach(t=>{
          const key = normId(t.truck_id);
          const col = normHex(t.color);
          if (key && col) truckColorMap[key] = col;
        });

        // ✅ Leads: normalize keys + derive _branch from customer_id (Customers table)
        const customerBranchById = {};
        customersData.forEach(c => {
          const id = (c.customer_id || "").toString().trim();
          if (id) customerBranchById[id] = c.branch || "";
        });

        const leadsData = leadsRaw.map(l => {
          const cid = (l.customer_id || "").toString().trim();
          return {
            ...l,
            _branch: customerBranchById[cid] || "",
            // รองรับ header จริงในชีท: nearest_truck_i
            nearest_truck_id: l.nearest_truck_id || l.nearest_truck_i || ""
          };
        });

        data = { settings, customers: customersData, leads: leadsData, trucks };

        // Settings: map center
        const findVal = key => (settings.find(r => (r.key||r.Key||r.setting||'').toString().toUpperCase()===key) || {}).value;
        const cLat = parseFloat(findVal('CENTER_LAT')||16.43),
              cLng = parseFloat(findVal('CENTER_LNG')||103.49),
              zoom = parseInt(findVal('ZOOM')||9);
        map.setView([cLat,cLng], zoom);

        const setOpts=(el,opts)=>{
          el.innerHTML='';
          el.append(new Option('ทั้งหมด',''));
          opts.forEach(o=>el.append(new Option(o,o)));
        };

        // Branch options from Customers only (Leads ไม่มี branch จริง)
        setOpts(branchFilter, uniqueSorted(customersData.map(c=>c.branch)));

        // ✅ ผู้รับผิดชอบจาก Customers.person_incharge
        setOpts(managerFilter, uniqueSorted(customersData.map(c=>c.person_incharge)));

        // Truck options from Trucks table
        setOpts(truckFilter, uniqueSorted(trucks.map(t=>t.truck_id)));

        render();
      }catch(err){
        showError(err.message||String(err));
      }
    }

    // Export (filtered) to Excel
    function exportFilteredToExcel(){
      try{
        const filteredCustomers = data.customers.filter(passFilters);
        const filteredLeads = (toggleLeads.checked ? data.leads : []).filter(passFilters);

       
          const customerColumns = [
          ['customer_id','Customer ID'],
          ['customer_name','ชื่อลูกค้า'],
          ['_statusTH','สถานะลูกค้า (TH)'],
          ['branch','สาขา'],
          ['truck_id','รหัสรถมิเตอร์'],
          ['person_incharge','ผู้รับผิดชอบ'],
          ['lastest_sales','ยอดขายล่าสุด'],
          ['notes','หมายเหตุ'],
          ['latitude','Latitude'],
          ['longitude','Longitude']
        ];

        // ✅ Leads columns ตาม source จริง + nearest_truck_i รองรับแล้วผ่าน nearest_truck_id
        const leadColumns = [
          ['lead_id','Lead ID'],
          ['leads_name','ชื่อลีด'],
          ['status','สถานะลีด'],
          ['saler','พนักงานขายผู้ดูแล'],
          ['customer_id','Customer ID'],
          ['_branch','สาขา (จาก Customer)'],
          ['nearest_truck_id','รถที่ใกล้สุด'],
          ['province','จังหวัด'],
          ['district','อำเภอ/เขต'],
          ['notes','หมายเหตุ'],
          ['latitude','Latitude'],
          ['longitude','Longitude']
        ];

        const mapRows = (rows, columns) => {
          return rows.map(r=>{
            const obj={};
            columns.forEach(([key,label])=>{
              let v = r[key];
              if((key==='latitude'||key==='longitude') && v!==undefined && v!==null && v!==''){
                const num = parseFloat(v);
                v = isFinite(num) ? +num.toFixed(6) : '';
              }
              obj[label] = (v === undefined || v === null) ? '' : v;
            });
            return obj;
          });
        };

        const customerData = mapRows(filteredCustomers, customerColumns);
        const leadData = mapRows(filteredLeads, leadColumns);

        const wb = XLSX.utils.book_new();
        const wsCustomers = XLSX.utils.json_to_sheet(customerData, { origin: 'A1' });
        const wsLeads = XLSX.utils.json_to_sheet(leadData, { origin: 'A1' });

        const fitCols = (columns) => columns.map(([,label])=>({ wch: Math.max(12, label.length + 4) }));
        wsCustomers['!cols'] = fitCols(customerColumns);
        wsLeads['!cols'] = fitCols(leadColumns);

        XLSX.utils.book_append_sheet(wb, wsCustomers, 'Customers (filtered)');
        XLSX.utils.book_append_sheet(wb, wsLeads, 'Leads (filtered)');

        const b=branchFilter.value || 'All';
        const m=managerFilter.value || 'All';
        const t=truckFilter.value || 'All';
        const s=statusFilter.value || 'All';
        const dateStr = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
        const filename = `KCP-Export_${dateStr}_B-${b}_PIC-${m}_T-${t}_S-${s}.xlsx`.replace(/[\\/:*?"<>|]+/g,'-');

        XLSX.writeFile(wb, filename);
      }catch(err){
        showError('ไม่สามารถส่งออกเป็น Excel ได้: ' + (err.message || String(err)));
      }
    }

    // UI bindings
    btnRefresh.onclick = ()=>loadAndRender();
    btnReset.onclick = ()=>{
      [branchFilter,managerFilter,truckFilter,statusFilter].forEach(el=>el.value="");
      document.querySelectorAll('.radiusChoice').forEach(ch=>{ ch.checked=false; });
      render();
    };

    [branchFilter,managerFilter,truckFilter,statusFilter,toggleLeads,toggleNearest]
      .forEach(el=> el.addEventListener('change',render));

    document.querySelectorAll('.radiusChoice').forEach(el=>{
      el.addEventListener('change', render);
    });

    btnExport.onclick = exportFilteredToExcel;

    // Init
    loadAndRender();
    setInterval(loadAndRender,300000); // 5 นาที
  </script>
</body>
</html>
